services:
  catalog-db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - catalog-db-data:/var/lib/postgresql/data


  catalog-migrator:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile

    env_file:
      - .env

    depends_on:
      catalog-db:
        condition: service_healthy

    entrypoint:
      - uv
      - run
      - alembic
      - upgrade
      - head

    restart: "no"


  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile

    env_file:
      - .env

    depends_on:
      catalog-migrator:
        condition: service_completed_successfully

    ports:
      - "8000:8000"


volumes:
  catalog-db-data:
